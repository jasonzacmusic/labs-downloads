name: Refresh hub
# Releases request one refresh through repository_dispatch; humans can run it on demand.
# There is no periodic scan and no push-triggered duplicate of a locally generated page.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-hub, registry-updated, release-published]
permissions:
  contents: write
concurrency:
  group: publish-hub
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate page
        env:
          # HUB_PAT (a read-only org token) lets it see PRIVATE repos' dates. Without it,
          # it still refreshes public repos and native download links.
          GITHUB_TOKEN: ${{ secrets.HUB_PAT || secrets.GITHUB_TOKEN }}
          HUB_HOST: "the cloud"
        run: python3 gen.py
      - name: Commit if changed
        run: |
          git config user.name "nathaniel-labs-bot"
          git config user.email "music@nathanielschool.com"
          git add index.html state.json
          git diff --cached --quiet || git commit -m "auto: refresh hub ($(date -u +%FT%TZ))"
          if ! git push; then
            git pull --rebase origin main
            git push
          fi
