name: Receive a build

# Puts an installer onto the downloads release when it cannot be uploaded from
# where it was built.
#
# Mac apps can only be BUILT on a Mac, and the machine that builds NSM Cut
# Studio lives in a private repo whose token cannot write here. This repo's own
# token can. So a build arrives as a commit on an `incoming/**` branch, this
# job moves it onto the release, and then deletes the branch again so the file
# never lands on main.
on:
  push:
    branches: ["incoming/**"]
  # A build pushed with a DEPLOY KEY lands the branch but does not start a
  # workflow — GitHub suppresses that. So the hub also sweeps for arrivals on
  # its own clock, which needs no credential from the sending repo at all.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write        # so it can kick the page regeneration afterwards

concurrency:
  group: receive-build
  cancel-in-progress: false

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      # On a push we are already on the incoming branch. On a sweep we have to
      # go and find one; if there is nothing waiting, stop quietly.
      - name: Find a waiting build
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          B="$(gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq \
                '.[].name | select(startswith("incoming/"))' | head -1)"
          [ -n "$B" ] && echo "branch=$B" >> "$GITHUB_OUTPUT" || echo "nothing waiting"

      - uses: actions/checkout@v4
        if: steps.find.outputs.branch != ''
        with:
          ref: ${{ steps.find.outputs.branch }}

      - name: Move the arrivals onto the release
        if: steps.find.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(incoming/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Nothing in incoming/ — the branch carried no build."
            exit 1
          fi
          printf 'uploading: %s\n' "${files[@]}"
          gh release upload downloads "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

          # Read it back off the public download address. An upload that
          # silently did nothing looks exactly like one that worked.
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$name"
            code="$(curl -sSL -o /dev/null -w '%{http_code}' "$url")"
            echo "$name -> $code"
            [ "$code" = "200" ] || { echo "::error::$name is not downloadable"; exit 1; }
          done

      - name: Put the branch back in the bin
        if: success() && steps.find.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The build is on the release now; leaving it in git would grow this
          # repo by an installer every single time.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${{ steps.find.outputs.branch }}" || true

      - name: Refresh the download page
        if: success() && steps.find.outputs.branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run refresh.yml --repo "$GITHUB_REPOSITORY" --ref main || true
